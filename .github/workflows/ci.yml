name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli2
      - name: Lint markdown
        run: ./node_modules/.bin/markdownlint-cli2